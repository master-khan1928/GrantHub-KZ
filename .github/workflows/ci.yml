name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "0:ci"
      ADMIN_ID: "1"
      WEB_ADMIN_TOKEN: test-token
      SESSION_SECRET: ci-secret
      LLM_PROVIDER: ollama
      TZ: Asia/Almaty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: python -X utf8 -m unittest discover -s tests -v
